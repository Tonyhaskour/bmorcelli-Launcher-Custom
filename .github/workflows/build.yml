name: Build Launcher Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Manually Clone Missing Submodules
        run: |
          rm -rf lib/DisplayDrivers
          git clone --depth 1 https://github.com/bmorcelli/DisplayDrivers.git lib/DisplayDrivers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Custom Launcher Environment
        run: |
          pio run -e esp32s3-st7735-custom

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-firmware
          # Grab ALL .bin files from the build directory, plus the framework's boot_app0.bin
          path: |
            .pio/build/esp32s3-st7735-custom/**/*.bin
            ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
