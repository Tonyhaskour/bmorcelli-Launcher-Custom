; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3-st7735-custom]
# One generic board JSON per MCU lives in boards/_jsonfiles: esp32, esp32s2,
# esp32s3, esp32c3, esp32c5, esp32c6, esp32p4 and esp32p4_es (pre rev.300).
board = esp32s3
board_build.partitions = support_files/custom_4Mb.csv

# ESP32-S3 N16R8 specific settings (16MB Flash, 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680
board_upload.speed = 921600

build_flags =
	${env.build_flags}
	# Device Specific build flags
	-DBOARD_HAS_PSRAM			            # Set it if board has PSRAM
	-DARDUINO_USB_MODE=1		            # ESP32S3 usually use it
	-DARDUINO_USB_CDC_ON_BOOT=1             # ESP32S3 usually use it
	;-DDISABLE_MASS_STORAGE=1               # if your ESP32-S3 uses a CH340 to UART-SERIAL convert, USB massStorage will not work,

	# Device information
	-D DEVICE_NAME='"ESP32-ST7735"'
	-D OTA_TAG='"esp32_st7735_ota"'
	-D OTA_EXTRA='"esp=S3"'
	-D DISABLE_OTA=1                 
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000

	# Screen default rotation
	-D ROTATION=1
	-D DIMMER_SETUP=20 # Set Default dimmer dim time

	# Navigation layout - You have 6 buttons (Up, Down, Left, Right, Select, Back)
	-D HAS_6_BUTTON=1

	# Display Pinouts
	# Data bus: 0 Arduino_HWSPI (shared SPI)
	-D TFT_DATABUS_N=0
	# Panel controller: 0 ST7735 
	-D TFT_DISPLAY_DRIVER_N=0
	-D TFT_WIDTH=160
	-D TFT_HEIGHT=128
	-D TFT_CS=45
	-D TFT_DC=21
	-D TFT_RST=14
	-D TOUCH_CS=-1
	-D TFT_MOSI=42
	-D TFT_SCLK=40
	-D TFT_BL=2
	-D TFT_IPS=0
	-D TFT_COL_OFS1=0
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	# SDCard macros needed to use SPI setup
	-D SDCARD_CS=1     
	-D SDCARD_SCK=40    
	-D SDCARD_MISO=41   
	-D SDCARD_MOSI=42   

lib_deps =
	${env.lib_deps}
	# Only if BUTTONS_IDF_COMPONENT=1 is set above:
	# https://github.com/bmorcelli/ESP32_Button
	# Only if HAS_ENCODER=1 is set above:
	# mathertel/RotaryEncoder @1.5.3

lib_ignore =
	SensorLib
	XPowersLib
	GFX Library for Arduino
