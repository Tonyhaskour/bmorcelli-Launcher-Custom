; PlatformIO Project Configuration File

[env:esp32s3-st7735-custom]
board = esp32s3
board_build.partitions = support_files/custom_4Mb.csv

# ESP32-S3 N16R8 specific settings (16MB Flash, 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680
board_upload.speed = 921600

# Tell PlatformIO to compile files in the board folder
build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>
	+<../boards/esp32s3-st7735-custom>

build_flags =
	${env.build_flags}
	
	# Include the board folder so local headers are found
	-Iboards/esp32s3-st7735-custom

	# Device Specific build flags
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

	# Device information
	-D DEVICE_NAME='"ESP32-ST7735"'
	-D OTA_TAG='"esp32_st7735_ota"'
	-D OTA_EXTRA='"esp=S3"'
	-D DISABLE_OTA=1                 
	-D LAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000

	# Screen default rotation (3 = Landscape)
	-D ROTATION=3
	-D DIMMER_SETUP=20

	# Navigation layout - 6 buttons
	-D HAS_6_BUTTON=1

	# Display Pinouts
	-D TFT_DATABUS_N=0
	-D TFT_DISPLAY_DRIVER_N=0     # 0 = ST7735
	-D TFT_WIDTH=160
	-D TFT_HEIGHT=128
	-D TFT_CS=45
	-D TFT_DC=21
	-D TFT_RST=14
	-D TOUCH_CS=-1
	-D TFT_MOSI=42
	-D TFT_SCLK=40
	-D TFT_BL=2
	-D TFT_IPS=0
	
	# OFFSET FIX (Pushes image right to hide the distorted edge)
	-D TFT_COL_OFS1=24
	-D TFT_ROW_OFS1=0
	-D TFT_COL_OFS2=0
	-D TFT_ROW_OFS2=0

	# SDCard macros needed to use SPI setup
	-D SDCARD_CS=1     
	-D SDCARD_SCK=40    
	-D SDCARD_MISO=41   
	-D SDCARD_MOSI=42   

	# Fix for AsyncTCP Watchdog under IDF 5.x
	-D CONFIG_ESP_TASK_WDT_TIMEOUT_S=5
	-D CONFIG_ASYNC_TCP_USE_WDT=0

lib_deps =
	${env.lib_deps}
	bblanchon/ArduinoJson @ ^7.0.4
	moononournation/GFX Library for Arduino @ ^1.5.5
	ESP32Async/ESPAsyncWebServer
	esp32async/AsyncTCP @ 3.3.8

lib_ignore =
	SensorLib
	XPowersLib
